# Secret para acesso ao repositorio privado (se necessario).
# Aplicar APENAS se o repo dvn-workshop-kubernetes for privado.
#
# Uso:
#   1. Substitua <username> e <PAT> pelos valores reais.
#   2. kubectl apply -f repo-secret.yaml
#
# IMPORTANTE: nao commitar este arquivo com credenciais preenchidas.
apiVersion: v1
kind: Secret
metadata:
  name: repo-dvn-workshop-kubernetes
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/wendel1w/workshop-july.git
  username: "Argo_workshop"
  password: "PAT_KUBERNETES_REPO"
  
